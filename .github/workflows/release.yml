name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GOFLAGS: -mod=readonly

jobs:
  release:
    if: github.repository == 'sinmentis/xiaohongshu-mcp-readonly'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release source
        run: |
          set -eu
          test -f NOTICE
          grep -Fxq 'module github.com/sinmentis/xiaohongshu-mcp-readonly' go.mod
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify and test
        run: |
          go mod verify
          go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist stage

          build_archive() {
            os="$1"
            arch="$2"
            suffix="$3"
            package="xiaohongshu-mcp-readonly-${VERSION}-${os}-${arch}"
            work="stage/${package}"
            mkdir -p "$work"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "${work}/xiaohongshu-mcp-readonly${suffix}" .

            cp LICENSE NOTICE README.md "$work/"
            if [ "$os" = windows ]; then
              (cd stage && zip -qr "../dist/${package}.zip" "$package")
            else
              tar -C stage -czf "dist/${package}.tar.gz" "$package"
            fi
            rm -rf "$work"
          }

          build_archive linux amd64 ""
          build_archive linux arm64 ""
          build_archive darwin amd64 ""
          build_archive darwin arm64 ""
          build_archive windows amd64 ".exe"

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
