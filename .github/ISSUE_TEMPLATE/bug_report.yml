name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove cookies, QR payloads, tokens, account identifiers, and proxy credentials.
  - type: dropdown
    id: site
    attributes:
      label: Site
      options:
        - RedNote
        - Xiaohongshu
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Go version, and browser source
      placeholder: Linux ARM64, Go 1.25.13, Playwright Chromium
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the command and the smallest reliable sequence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text
  - type: checkboxes
    id: confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all session data, QR payloads, tokens, account identifiers, and proxy credentials.
          required: true
