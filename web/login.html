<!doctype html>
<!--
THESIS: A local account connection, not a marketing page. One state, one next step.
OWN-WORLD: Paper white, ink black, a red signature, system type, precise borders.
STORY: Scan, confirm, connect. Credentials stay on this machine.
FIRST VIEWPORT: A quiet header above a centered connection workspace and local-access footer.
FORM: Brief-pinned minimal utility. The QR gives way to a clear completion mark.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="Connect your Xiaohongshu or RedNote account to the local, read-only MCP server. Scan to sign in. Your session stays on this device.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Connect account · Xiaohongshu / RedNote MCP</title>
  <link rel="icon" href="/login/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login/styles.css">
  <script src="/login/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="/login" aria-label="Read-only MCP connection">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 12V4h8M20 4h8v8M28 20v8h-8M12 28H4v-8"/>
          <path d="M12 12h8v8h-8z"/>
        </svg>
        <span id="brand-label">Read-only MCP</span>
      </a>
      <span class="local-label"><span aria-hidden="true"></span>Local connection</span>
    </header>

    <main id="connection" class="connection" aria-labelledby="stage-title" data-state="loading" aria-busy="true">
      <div class="heading">
        <h1 id="stage-title">Connect your account.</h1>
        <p id="stage-detail">Preparing your sign-in.</p>
      </div>

      <div id="qr-frame" class="connection-visual">
        <img id="qr-image" width="264" height="264" alt="Account sign-in QR code" hidden>
        <div id="qr-placeholder" class="placeholder">
          <span class="spinner" aria-hidden="true"></span>
          <svg class="state-symbol success-symbol" viewBox="0 0 64 64" aria-hidden="true">
            <path d="m18 33 9 9 20-21"/>
          </svg>
          <svg class="state-symbol error-symbol" viewBox="0 0 64 64" aria-hidden="true">
            <path d="m23 23 18 18m0-18L23 41"/>
          </svg>
          <svg class="state-symbol idle-symbol" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M22 8h20a4 4 0 0 1 4 4v40a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4Zm5 40h10"/>
          </svg>
        </div>
      </div>

      <div class="session-status" role="status" aria-live="polite" aria-atomic="true">
        <span id="status-dot" class="status-dot is-working" aria-hidden="true"></span>
        <span id="status-label">Starting sign-in</span>
      </div>
      <p id="session-time" class="session-time"></p>
      <button id="retry-button" class="retry-button" type="button" hidden>Try again</button>

      <details class="connection-details">
        <summary>Connection details<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></summary>
        <dl>
          <div><dt>Server</dt><dd><code id="server-address">127.0.0.1</code></dd></div>
          <div><dt>Access</dt><dd>6 read-only tools</dd></div>
          <div><dt>Session</dt><dd>Stored on this device</dd></div>
        </dl>
        <p>No publishing, comments, likes, or favorites.</p>
      </details>
      <noscript><p class="no-script">Enable JavaScript to display the sign-in code and connection status.</p></noscript>
    </main>

    <footer>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="1.5"/><path d="M5.5 7V4a2.5 2.5 0 0 1 5 0v3"/></svg>
      Your session stays on this device.
    </footer>
  </div>
</body>
</html>
